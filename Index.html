<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#212121;color:#eee;font:15px system-ui;height:100vh}
.app{max-width:900px;margin:auto;height:100%;display:flex;flex-direction:column}
header{height:58px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
select{background:#2f2f2f;color:#eee;border:1px solid #444;border-radius:9px;padding:8px;max-width:270px}
#chat{flex:1;overflow:auto;padding:25px 16px 120px}
.msg{max-width:760px;margin:0 auto 25px;white-space:pre-wrap;line-height:1.6}
.name{font-weight:700;margin-bottom:5px}
.composer{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#212121 25%)}
.box{max-width:760px;margin:auto;background:#2f2f2f;border:1px solid #444;border-radius:16px;padding:8px;display:flex;gap:8px}
textarea{flex:1;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:9px;font:inherit}
button{border:0;border-radius:10px;padding:0 15px;font-weight:700;cursor:pointer}
</style>
</head>

<body>
<div class="app">

<header>
<b>AI Chat</b>

<select id="model">
<optgroup label="OpenAI">
<option value="gpt-5.6-luna">gpt-5.6-luyna</option>
<option value="gpt-5.6-sol">gpt-5.6-sol</option>
<option value="gpt-5.6-terra">gpt-5.6-terra</option>
</optgroup>

<optgroup label="Claude">
<option value="claude-fable-5">claude-fable-5</option>
<option value="claude-opus-4-8">claude-opus-4-8</option>
<option value="claude-sonnet-5">claude-sonnet-5</option>
</optgroup>

<optgroup label="MiMo">
<option value="mimo-v2.5">mimo-v2.5</option>
<option value="mimo-v2.5-pro">mimo-v2.5-pro</option>
</optgroup>

<optgroup label="DeepSeek">
<option value="deepseek-v4-flash">deepseek-v4-flash</option>
<option value="deepseek-v4-pro">deepseek-v4-pro</option>
</optgroup>

<optgroup label="MiniMax">
<option value="MiniMax-H3">MiniMax-H3</option>
</optgroup>
</select>
</header>

<main id="chat">
<div class="msg">
<div class="name">AI</div>
How can I help?
</div>
</main>

<div class="composer">
<div class="box">
<textarea id="input" rows="1" placeholder="Message..."></textarea>
<button id="send">↑</button>
</div>
</div>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const model=document.getElementById("model");

let messages=[];

function add(role,text){
  const d=document.createElement("div");
  d.className="msg";

  const n=document.createElement("div");
  n.className="name";
  n.textContent=role==="user"?"You":"AI";

  const t=document.createElement("div");
  t.textContent=text;

  d.append(n,t);
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;

  return t;
}

async function go(){
  const text=input.value.trim();
  if(!text||send.disabled)return;

  input.value="";
  add("user",text);

  messages.push({
    role:"user",
    content:text
  });

  send.disabled=true;
  const out=add("assistant","Thinking...");

  try{
    const r=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:model.value,
        messages:messages
      })
    });

    const d=await r.json();

    if(!r.ok){
      throw new Error(d?.error?.message||`HTTP ${r.status}`);
    }

    out.textContent=d.answer||"No response.";

    messages.push({
      role:"assistant",
      content:d.answer||""
    });

  }catch(e){
    out.textContent="Error: "+e.message;
    messages.pop();
  }

  send.disabled=false;
  input.focus();
}

send.onclick=go;

input.onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    go();
  }
};
</script>
</body>
</html>
